name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: corepack enable

      - run: corepack prepare pnpm@11.3.0 --activate

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint

      - run: pnpm test -- --run
